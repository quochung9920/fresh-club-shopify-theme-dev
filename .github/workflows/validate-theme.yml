name: Validate Shopify theme

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install locked Shopify CLI dependencies
        run: npm ci --ignore-scripts

      - name: Validate theme structure and JSON
        run: npm run validate:structure

      - name: Verify immutable Theme Check baseline on PRs
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/verify_theme_check_baseline.py
          --baseline .theme-check-baseline.json
          --base-ref "origin/${{ github.base_ref }}"

      - name: Validate Theme Check baseline metadata on manual runs
        if: github.event_name != 'pull_request'
        run: python scripts/verify_theme_check_baseline.py --baseline .theme-check-baseline.json

      - name: Run locked Theme Check regression gate
        run: npm run validate:theme

      - name: Upload Theme Check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: theme-check-report
          path: theme-check-report.json
          if-no-files-found: error
